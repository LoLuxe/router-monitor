<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Router Monitor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #0d0d0f;
    --surface:  #161618;
    --border:   #232327;
    --text-1:   #f0f0f0;
    --text-2:   #8a8a90;
    --text-3:   #55555c;
    --green:    #22c55e;
    --green-bg: rgba(34,197,94,.08);
    --red:      #ef4444;
    --red-bg:   rgba(239,68,68,.08);
  }
  body {
    background: var(--bg);
    color: var(--text-1);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .router-icon {
    width: 36px; height: 36px;
    background: #1e1e22;
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .header-title { font-size: 15px; font-weight: 500; }
  .header-sub   { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .badge {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 12px;
    border-radius: 99px;
    font-size: 13px; font-weight: 500;
    transition: all .3s;
  }
  .badge.online  { background: var(--green-bg); color: var(--green); }
  .badge.offline { background: var(--red-bg);   color: var(--red);   }
  .badge.loading { background: #1e1e22; color: var(--text-3); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .dot.pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }
  .metric-section {
    background: #111114;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    text-align: center;
  }
  .metric-label { font-size: 11px; color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
  .metric-value { font-size: 36px; font-weight: 300; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .metric-unit  { font-size: 16px; color: var(--text-2); margin-left: 4px; }
  .section-label { font-size: 11px; color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; }
  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-item {
    display: flex; align-items: center; justify-content: space-between;
    background: #111114;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
  }
  .history-item-left { display: flex; align-items: center; gap: 10px; }
  .h-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .h-time { font-size: 13px; font-variant-numeric: tabular-nums; }
  .h-ago  { font-size: 12px; color: var(--text-3); }
  .footer { margin-top: 20px; display: flex; align-items: center; justify-content: space-between; }
  .footer-note { font-size: 11px; color: var(--text-3); }
  .refresh-btn {
    font-size: 12px; color: var(--text-3);
    background: none; border: none; cursor: pointer;
    padding: 4px 8px; border-radius: 6px;
    transition: color .15s, background .15s;
  }
  .refresh-btn:hover { color: var(--text-2); background: #1e1e22; }
  .spin { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton {
    background: linear-gradient(90deg, #1a1a1e 25%, #222226 50%, #1a1a1e 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 6px;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .no-data { text-align: center; padding: 20px 0; color: var(--text-3); font-size: 14px; }

  /* Register section */
  .register-section {
    margin-top: 20px;
    background: #111114;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .register-label { font-size: 11px; color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; }
  .register-row { display: flex; gap: 8px; }
  .register-input {
    flex: 1;
    background: #1a1a1e;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-1);
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    transition: border-color .15s;
  }
  .register-input:focus { border-color: #555; }
  .register-input::placeholder { color: var(--text-3); }
  .register-btn {
    background: #22c55e18;
    border: 1px solid #22c55e30;
    color: var(--green);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s;
  }
  .register-btn:hover { background: #22c55e28; }
  .register-msg { font-size: 12px; color: var(--text-3); margin-top: 8px; min-height: 16px; }
  .register-msg.ok  { color: var(--green); }
  .register-msg.err { color: var(--red); }
</style>
</head>
<body>
<main class="card">
  <div class="header">
    <div class="header-left">
      <div class="router-icon">📡</div>
      <div>
        <div class="header-title">Router Monitor</div>
        <div class="header-sub" id="updated">Загрузка...</div>
      </div>
    </div>
    <div class="badge loading" id="badge">
      <span class="dot"></span>
      <span id="badge-text">—</span>
    </div>
  </div>

  <div class="metric-section">
    <div class="metric-label">Тишина с последнего сигнала</div>
    <div><span class="metric-value" id="silence">—</span><span class="metric-unit" id="silence-unit"></span></div>
  </div>

  <div class="section-label">Последние сигналы</div>
  <div class="history-list" id="history">
    <div class="history-item skeleton" style="height:40px;border:none;"></div>
    <div class="history-item skeleton" style="height:40px;border:none;margin-top:6px"></div>
    <div class="history-item skeleton" style="height:40px;border:none;margin-top:6px"></div>
  </div>

  <div class="register-section">
    <div class="register-label">Уведомления в Telegram</div>
    <div class="register-row">
      <input class="register-input" id="tg-id" type="text" placeholder="Ваш Telegram ID (числовой)">
      <button class="register-btn" onclick="register()">Подписаться</button>
    </div>
    <div class="register-msg" id="reg-msg">Узнать ID: напишите @userinfobot в Telegram</div>
  </div>

  <div class="footer">
    <span class="footer-note" id="next-refresh">Автообновление через 30 с</span>
    <button class="refresh-btn" id="refresh-btn" onclick="load()">↻ Обновить</button>
  </div>
</main>

<script>
function formatSilence(s) {
  if (s < 60) return [s, 'с'];
  if (s < 3600) return [Math.round(s / 60), 'мин'];
  return [(s / 3600).toFixed(1), 'ч'];
}
function formatDate(ts) {
  const d = new Date(ts);
  const today = new Date();
  const time = d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  if (d.toDateString() === today.toDateString()) return time;
  return d.toLocaleDateString('ru-RU', { day:'numeric', month:'short' }) + ' ' + time;
}
function timeAgo(ts) {
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return `${s} с назад`;
  if (s < 3600) return `${Math.round(s/60)} мин назад`;
  return `${Math.round(s/3600)} ч назад`;
}

async function load() {
  const btn = document.getElementById('refresh-btn');
  btn.innerHTML = '<span class="spin">↻</span> Обновить';
  btn.disabled = true;
  try {
    const r = await fetch('/api/status?_=' + Date.now());
    render(await r.json());
  } catch {
    document.getElementById('updated').textContent = 'Ошибка загрузки';
  } finally {
    btn.innerHTML = '↻ Обновить';
    btn.disabled = false;
  }
}

function render(data) {
  document.getElementById('updated').textContent =
    'Обновлено в ' + new Date().toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit', second:'2-digit' });

  const badge = document.getElementById('badge');
  const dot   = badge.querySelector('.dot');
  const text  = document.getElementById('badge-text');
  const sEl   = document.getElementById('silence');
  const uEl   = document.getElementById('silence-unit');
  const hEl   = document.getElementById('history');

  if (data.status === 'no_data') {
    badge.className = 'badge loading';
    dot.className = 'dot';
    text.textContent = 'Нет данных';
    sEl.textContent = '—'; uEl.textContent = '';
    hEl.innerHTML = '<div class="no-data">Сигналов ещё не было</div>';
    return;
  }

  const online = data.status === 'ONLINE';
  badge.className = 'badge ' + (online ? 'online' : 'offline');
  dot.className = 'dot' + (online ? ' pulse' : '');
  text.textContent = online ? 'Есть свет' : 'Нет света';

  const [val, unit] = formatSilence(data.silence_seconds);
  sEl.textContent = val;
  sEl.style.color = data.silence_seconds > 180 ? 'var(--red)' : 'var(--text-1)';
  uEl.textContent = ' ' + unit;

  const history = data.history || [];
  hEl.innerHTML = history.length
    ? history.map(ts => `
        <div class="history-item">
          <div class="history-item-left">
            <span class="h-dot"></span>
            <span class="h-time">${formatDate(ts)}</span>
          </div>
          <span class="h-ago">${timeAgo(ts)}</span>
        </div>`).join('')
    : '<div class="no-data">Нет истории</div>';
}

async function register() {
  const id = document.getElementById('tg-id').value.trim();
  const msg = document.getElementById('reg-msg');
  if (!/^\d+$/.test(id)) { msg.className='register-msg err'; msg.textContent='Введите числовой Telegram ID'; return; }
  msg.className='register-msg'; msg.textContent='Отправка...';
  try {
    const r = await fetch('/api/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ chat_id: id })
    });
    const d = await r.json();
    if (d.ok) { msg.className='register-msg ok'; msg.textContent='✓ Подписка оформлена'; }
    else       { msg.className='register-msg err'; msg.textContent=d.error||'Ошибка'; }
  } catch {
    msg.className='register-msg err'; msg.textContent='Ошибка сети';
  }
}

let countdown = 30;
setInterval(() => {
  countdown--;
  document.getElementById('next-refresh').textContent = `Автообновление через ${countdown} с`;
  if (countdown <= 0) { countdown = 30; load(); }
}, 1000);

load();
</script>
</body>
</html>
